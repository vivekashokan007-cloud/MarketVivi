name: MarketVivi Review Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'api.js'
      - 'index.html'
      - 'log-viewer.js'
      - 'manifest.json'
      - 'style.css'
      - 'test_*.mjs'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/review-validation.yml'
      - '.github/workflows/pages-publish.yml'
  push:
    branches:
      - main
      - work/g8-g10-integrity-20260913
      - review/codex-corrective-20260914
      - work/paper-implied-ev-v12-20261013
      - work/overnight-integrity-b507-20261015
    paths:
      - 'app.js'
      - 'api.js'
      - 'index.html'
      - 'log-viewer.js'
      - 'manifest.json'
      - 'style.css'
      - 'test_*.mjs'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/review-validation.yml'
      - '.github/workflows/pages-publish.yml'

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-only:
    name: PWA syntax and Paper runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout MarketVivi
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # b506: the PWA-chain test executes the REAL injected NativeBridge facade from Marketapp's MainActivity.kt.
      # Same branch name when it exists in Marketapp (paired review), else Marketapp main.
      - name: Resolve paired Marketapp ref
        id: pair
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/vivekashokan007-cloud/Marketapp.git "$ref" >/dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout paired Marketapp (read-only, for the real bridge facade)
        uses: actions/checkout@v4
        with:
          repository: vivekashokan007-cloud/Marketapp
          ref: ${{ steps.pair.outputs.ref }}
          path: _marketapp
          persist-credentials: false
          sparse-checkout: |
            tools/bridge_facade
            tools/b507_chain
            app/src/main/java/com/marketradar/app/MainActivity.kt
            app/src/main/java/com/marketradar/app/NativeBridge.kt
            app/src/main/java/com/marketradar/app/BackgroundResume.kt
          sparse-checkout-cone-mode: false

      - name: Validate app syntax
        run: node --check app.js

      - name: Run ALL PWA tests (root test_*.mjs and tests/*.mjs)
        run: |
          shopt -s nullglob
          files=(test_*.mjs tests/test_*.mjs)
          test "${#files[@]}" -ge 20 || { echo "expected >=20 test files, found ${#files[@]}"; exit 1; }
          for f in tests/test_ev_v12_pwa.mjs tests/test_ev_v12_review_r2.mjs tests/test_ev_v12_review_r3.mjs tests/test_ev_v12_review_r4.mjs tests/test_ev_v12_review_r5.mjs tests/test_b507_version.mjs tests/test_b507_overnight_chain.mjs tests/test_b507_r1_authority.mjs tests/test_ev_v12_control_b505.mjs tests/test_ev_v12_bridge_chain_b506.mjs; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          MARKETAPP_DIR="$PWD/_marketapp" node --test "${files[@]}"
          MARKETAPP_DIR="$PWD/_marketapp" node --test tests/test_ev_v12_bridge_chain_b506.mjs | tee /tmp/chain.log
          grep -q '^# pass 5' /tmp/chain.log
          # b507 real overnight chain: Kotlin SessionInputs golden -> Python brain golden -> real facade -> real app.js
          test -f _marketapp/tools/b507_chain/native_context_golden.json
          test -f _marketapp/tools/b507_chain/brain_output_golden.json
          MARKETAPP_DIR="$PWD/_marketapp" node --test tests/test_b507_overnight_chain.mjs | tee /tmp/b507chain.log
          grep -q '^# pass 7' /tmp/b507chain.log
          grep -q '^# fail 0' /tmp/b507chain.log
          # M0 Batch 1 W1: research collector through the REAL facade (AndroidBridge only)
          MARKETAPP_DIR="$PWD/_marketapp" node --test tests/test_m0_real_bridge.mjs | tee /tmp/m0bridge.log
          grep -q '^# pass 4' /tmp/m0bridge.log
          grep -q '^# fail 0' /tmp/m0bridge.log
          (cd _marketapp && git rev-parse HEAD)

      - name: Verify Pages artifact excludes repository documents
        run: |
          python3 tools/build_pages_site.py --output .pages-artifact
          test -f .pages-artifact/index.html
          test ! -e .pages-artifact/docs
          test ! -e .pages-artifact/PROJECT_KNOWLEDGE.md
          test ! -e .pages-artifact/CLAUDE.md
