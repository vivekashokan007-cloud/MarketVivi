name: MarketVivi Review Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'api.js'
      - 'index.html'
      - 'log-viewer.js'
      - 'manifest.json'
      - 'style.css'
      - 'test_*.mjs'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/review-validation.yml'
      - '.github/workflows/pages-publish.yml'
  push:
    branches:
      - main
      - work/g8-g10-integrity-20260913
      - review/codex-corrective-20260914
      - work/paper-implied-ev-v12-20261013
    paths:
      - 'app.js'
      - 'api.js'
      - 'index.html'
      - 'log-viewer.js'
      - 'manifest.json'
      - 'style.css'
      - 'test_*.mjs'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/review-validation.yml'
      - '.github/workflows/pages-publish.yml'

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-only:
    name: PWA syntax and Paper runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout MarketVivi
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate app syntax
        run: node --check app.js

      - name: Run ALL PWA tests (root test_*.mjs and tests/*.mjs)
        run: |
          shopt -s nullglob
          files=(test_*.mjs tests/test_*.mjs)
          test "${#files[@]}" -ge 20 || { echo "expected >=20 test files, found ${#files[@]}"; exit 1; }
          for f in tests/test_ev_v12_pwa.mjs tests/test_ev_v12_review_r2.mjs tests/test_b504_version.mjs; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          node --test "${files[@]}"

      - name: Verify Pages artifact excludes repository documents
        run: |
          python3 tools/build_pages_site.py --output .pages-artifact
          test -f .pages-artifact/index.html
          test ! -e .pages-artifact/docs
          test ! -e .pages-artifact/PROJECT_KNOWLEDGE.md
          test ! -e .pages-artifact/CLAUDE.md
